<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema POS Web - Minimarket y Bodega</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f4f6f9; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #007bff; color: white; padding: 10px 15px; border-radius: 5px; }
    .nav-buttons { margin-top: 10px; }
    .nav-buttons button { padding: 10px 15px; margin-right: 5px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; background: #e2e6ea; }
    .layout { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
    .pos-section { flex: 2; min-width: 300px; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .cart-section { flex: 1; min-width: 280px; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .btn-quick { padding: 20px 10px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    .btn-express { background: #17a2b8; margin: 3px; color: white; padding: 10px; border: none; border-radius: 3px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    .status-offline { background: #dc3545; color: white; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
    .status-online { background: #28a745; color: white; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
    input[type="text"], input[type="number"] { padding: 8px; margin-bottom: 8px; width: calc(100% - 18px); }
  </style>
</head>
<body>

  <div class="header">
    <h2>POS Web Inteligente</h2>
    <div>
      <span id="connection-status" class="status-online">En línea</span>
      <span id="sync-badge" style="margin-left: 10px; background: #ffc107; color: black; padding: 2px 6px; border-radius: 3px;">Pendientes: 0</span>
    </div>
  </div>

  <div class="nav-buttons">
    <button onclick="cambiarModo('quiosco')">Modo Quiosco / Bodega</button>
    <button onclick="cambiarModo('minimarket')">Modo Minimarket</button>
  </div>

  <div class="layout">
    <!-- Panel Izquierdo: Interfaz de Productos -->
    <div class="pos-section">
      <!-- Modo Quiosco / Bodega (Botones Rápidos)[cite: 1] -->
      <div id="modo-quiosco">
        <h3>Modo Rápido - Pantalla Táctil</h3>
        <div class="quick-grid">
          <button class="btn-quick" onclick="agregarArticuloDirecto('Pan', 0.50)">Pan<br>S/ 0.50</button>
          <button class="btn-quick" onclick="agregarArticuloDirecto('Gaseosa 500ml', 3.00)">Gaseosa<br>S/ 3.00</button>
          <button class="btn-quick" onclick="agregarArticuloDirecto('Snack', 2.00)">Snack<br>S/ 2.00</button>
          <button class="btn-quick" onclick="agregarArticuloDirecto('Cigarro c/u', 1.50)">Cigarro<br>S/ 1.50</button>
        </div>
      </div>

      <!-- Modo Minimarket (Escáner y Genéricos)[cite: 1] -->
      <div id="modo-minimarket" style="display: none;">
        <h3>Escáner de Código de Barras / Alias</h3>
        <input type="text" id="barcode-input" placeholder="Escanear código de barra..." autofocus>
        
        <h4 style="margin-top: 20px;">Artículo Genérico / Precio Abierto</h4>
        <input type="text" id="generic-name" placeholder="Descripción (Ej. Abarrotes)">
        <input type="number" id="generic-price" placeholder="Monto S/">
        <button onclick="agregarGenerico()" style="padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">Agregar al Carrito</button>
      </div>
    </div>

    <!-- Panel Derecho: Carrito y Cobro Express -->
    <div class="cart-section">
      <h3>Detalle de Venta</h3>
      <div style="max-height: 250px; overflow-y: auto;">
        <table id="cart-table">
          <thead>
            <tr>
              <th>Prod.</th>
              <th>Cant.</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      
      <h3 id="total-amount" style="margin-top: 15px; color: #333;">Total: S/ 0.00</h3>

      <div>
        <h4>Cobro Express[cite: 1]</h4>
        <button class="btn-express" onclick="procesarPagoRapido(10)">Pagó con S/ 10</button>
        <button class="btn-express" onclick="procesarPagoRapido(20)">Pagó con S/ 20</button>
        <button class="btn-express" onclick="procesarPagoExactoDigital()" style="background: #28a745;">Yape / Plin Exacto</button>
      </div>

      <br>
      <button onclick="conectarEImprimirTicketBT()" style="width: 100%; padding: 10px; background: #6c757d; color: white; border: none; font-size: 14px; border-radius: 4px; cursor: pointer;">
        🖨️ Conectar Impresora Bluetooth (ESC/POS)
      </button>
    </div>
  </div>

  <script>
    // Enlace exacto de tu Google Apps Script proporcionado[cite: 1]
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxXpMgPYWmvduihcH37oU80-tdP9qik7QaDChQeG2xZt6lcsk9A8xI5dH4XREJE_Oq1Yw/exec";
    
    let carrito = [];
    let db;

    // Inicializar IndexedDB para modo Offline y caché de respaldo[cite: 1]
    const request = indexedDB.open("PosOfflineDB", 1);
    request.onupgradeneeded = function(event) {
      db = event.target.result;
      if (!db.objectStoreNames.contains("ventas_pendientes")) {
        db.createObjectStore("ventas_pendientes", { autoIncrement: true });
      }
    };
    request.onsuccess = function(event) {
      db = event.target.result;
      actualizarBadgePendientes();
    };

    function cambiarModo(modo) {
      document.getElementById('modo-quiosco').style.display = modo === 'quiosco' ? 'block' : 'none';
      document.getElementById('modo-minimarket').style.display = modo === 'minimarket' ? 'block' : 'none';
    }

    function agregarArticuloDirecto(descripcion, precio) {
      carrito.push({ id: 'DIRECTO', descripcion: descripcion, cantidad: 1, precioUnitario: precio, total: precio });
      renderizarCarrito();
    }

    function agregarGenerico() {
      const desc = document.getElementById('generic-name').value || 'Artículo Varios';
      const precio = parseFloat(document.getElementById('generic-price').value);
      if (precio > 0) {
        carrito.push({ id: 'GENERICO', descripcion: desc, cantidad: 1, precioUnitario: precio, total: precio });
        renderizarCarrito();
        document.getElementById('generic-name').value = '';
        document.getElementById('generic-price').value = '';
      } else {
        alert("Ingrese un precio válido.");
      }
    }

    function renderizarCarrito() {
      const tbody = document.querySelector("#cart-table tbody");
      tbody.innerHTML = "";
      let total = 0;
      carrito.forEach((item) => {
        total += item.total;
        tbody.innerHTML += `<tr><td>${item.descripcion}</td><td>${item.cantidad}</td><td>S/ ${item.total.toFixed(2)}</td></tr>`;
      });
      document.getElementById("total-amount").innerText = "Total: S/ " + total.toFixed(2);
    }

    // Monitoreo de Red (Online / Offline)[cite: 1]
    window.addEventListener('online', () => {
      document.getElementById('connection-status').className = 'status-online';
      document.getElementById('connection-status').innerText = 'En línea';
      sincronizarVentasPendientes();
    });
    
    window.addEventListener('offline', () => {
      document.getElementById('connection-status').className = 'status-offline';
      document.getElementById('connection-status').innerText = 'Sin Conexión (Offline)';
    });

    async function procesarPagoRapido(montoRecibido) {
      if (carrito.length === 0) {
        alert("El carrito está vacío.");
        return;
      }
      const total = carrito.reduce((acc, curr) => acc + curr.total, 0);
      if (montoRecibido < total) {
        alert("El monto recibido es menor al total de la venta.");
        return;
      }
      const vuelto = montoRecibido - total;
      alert(`Venta Procesada con éxito.\nVuelto a entregar: S/ ${vuelto.toFixed(2)}`);
      
      const payloadVenta = {
        items: carrito,
        cajero: 'Cajero1',
        metodoPago: 'Efectivo',
        montoRecibido: montoRecibido,
        vuelto: vuelto
      };

      await enviarDatosAlServidor(payloadVenta);
    }

    async function procesarPagoExactoDigital() {
      if (carrito.length === 0) {
        alert("El carrito está vacío.");
        return;
      }
      const total = carrito.reduce((acc, curr) => acc + curr.total, 0);
      alert(`Pago digital (Yape/Plin) registrado por S/ ${total.toFixed(2)}`);

      const payloadVenta = {
        items: carrito,
        cajero: 'Cajero1',
        metodoPago: 'Yape/Plin',
        montoRecibido: total,
        vuelto: 0
      };

      await enviarDatosAlServidor(payloadVenta);
    }

    async function enviarDatosAlServidor(payloadVenta) {
      if (navigator.onLine) {
        try {
          await fetch(URL_WEB_APP, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ accion: "registrarVenta", payload: payloadVenta })
          });
          
          carrito = [];
          renderizarCarrito();
        } catch (error) {
          console.error("Fallo de red al enviar, guardando en caché local...", error);
          guardarVentaEnIndexedDB(payloadVenta);
        }
      } else {
        guardarVentaEnIndexedDB(payloadVenta);
      }
    }

    function guardarVentaEnIndexedDB(venta) {
      const tx = db.transaction("ventas_pendientes", "readwrite");
      const store = tx.objectStore("ventas_pendientes");
      store.add(venta);
      tx.oncomplete = () => {
        carrito = [];
        renderizarCarrito();
        actualizarBadgePendientes();
        alert("Venta guardada localmente (Modo Offline). Se sincronizará al recuperar internet.");
      };
    }

    function actualizarBadgePendientes() {
      if (!db) return;
      const tx = db.transaction("ventas_pendientes", "readonly");
      const store = tx.objectStore("ventas_pendientes");
      const countReq = store.count();
      countReq.onsuccess = () => {
        document.getElementById("sync-badge").innerText = `Pendientes: ${countReq.result}`;
      };
    }

    function sincronizarVentasPendientes() {
      if (!db) return;
      const tx = db.transaction("ventas_pendientes", "readwrite");
      const store = tx.objectStore("ventas_pendientes");
      const getAllReq = store.getAll();

      getAllReq.onsuccess = async () => {
        const ventas = getAllReq.result;
        if (ventas.length === 0) return;

        for (const venta of ventas) {
          try {
            await fetch(URL_WEB_APP, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ accion: "registrarVenta", payload: venta })
            });
          } catch(e) {
            console.error("Error sincronizando venta pendiente", e);
            return;
          }
        }

        store.clear();
        actualizarBadgePendientes();
        console.log("Sincronización de ventas pendientes completada.");
      };
    }

    // Impresión ESC/POS por Bluetooth (Web Bluetooth API)[cite: 1]
    async function conectarEImprimirTicketBT() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }]
        });
        const server = await device.gatt.connect();
        alert("Impresora térmica conectada correctamente por Bluetooth.");
      } catch (e) {
        alert("No se pudo conectar a la impresora o el navegador no soporta Bluetooth: " + e.message);
      }
    }
  </script>
</body>
</html>
